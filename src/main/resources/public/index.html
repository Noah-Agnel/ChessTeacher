<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chess</title>
<style>
  #app { display: flex; gap: 24px; align-items: flex-start; }
  #board { display: grid; grid-template-columns: repeat(8, 64px);
           grid-template-rows: repeat(8, 64px); width: 512px; }
  .sq { display: flex; align-items: center; justify-content: center;
        font-size: 44px; cursor: pointer; user-select: none; }
  .light { background: #f0d9b5; }
  .dark  { background: #b58863; }
  .selected { outline: 3px solid #2a7; outline-offset: -3px; }
  #controls { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  #controls button { font-size: 18px; padding: 4px 12px; }
  #promo button { font-size: 36px; margin-right: 6px; }

  #moves { width: 240px; height: 512px; overflow-y: auto; box-sizing: border-box;
           border: 1px solid #ccc; font-family: sans-serif; font-size: 16px; }
  .row { display: grid; grid-template-columns: 40px 1fr 1fr; }
  .num { color: #888; background: #f3f3f3; padding: 6px 8px; }
  .mv  { padding: 6px 8px; }
  .current { background: #cfd8dc; font-weight: bold; border-radius: 3px; }
  .sq { position: relative; }
  .hint::after { content: ''; position: absolute; top: 50%; left: 50%;
                 width: 20px; height: 20px; border-radius: 50%;
                 transform: translate(-50%, -50%);
                 background: rgba(0, 0, 0, 0.2); pointer-events: none; }
  .hint-capture::after { content: ''; position: absolute; inset: 0;
                         box-sizing: border-box; border-radius: 50%;
                         border: 6px solid rgba(0, 0, 0, 0.2); pointer-events: none; }

  /* Flèche du meilleur coup (superposée à l'échiquier, comme chess.com) */
  #board-wrap { position: relative; width: 512px; height: 512px; }
  #arrows { position: absolute; top: 0; left: 0; width: 512px; height: 512px;
            pointer-events: none; }
  .best-sq { box-shadow: inset 0 0 0 512px rgba(255, 170, 0, 0.35); }
  #best-btn { font-size: 16px; padding: 4px 10px; }

  /* Curseur de niveau du bot */
  #niveau { margin-top: 12px; font-family: sans-serif; font-size: 16px; width: 512px; }
  #niveau .titre { display: flex; justify-content: space-between; margin-bottom: 4px; }
  #elo-val { font-weight: bold; }
  #elo-cat { color: #666; }
  #ai-level { width: 100%; accent-color: #b58863; cursor: pointer; }
  #niveau .bornes { display: flex; justify-content: space-between; color: #999; font-size: 12px; }
  #best-info { font-family: sans-serif; font-size: 16px; min-height: 20px; margin: 8px 0 0; }
  #best-info .eval { display: inline-block; padding: 1px 6px; border-radius: 3px;
                     font-weight: bold; margin-left: 6px; }
  #best-info .eval.blanc { background: #fff; color: #222; border: 1px solid #aaa; }
  #best-info .eval.noir  { background: #333; color: #fff; border: 1px solid #333; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="board-wrap">
      <div id="board"></div>
      <svg id="arrows" viewBox="0 0 512 512"></svg>
    </div>
    <div id="controls">
      <button onclick="act('/api/undo')" title="Previous move (←)">◀</button>
      <button onclick="act('/api/redo')" title="Next move (→)">▶</button>
      <span id="counter"></span>
      <button onclick="act('/api/restart')">Restart</button>
    </div>
    <!-- CURSEUR DE NIVEAU DU BOT -->
    <div id="niveau">
      <div class="titre">
        <span>Niveau du bot : <span id="elo-val">1500</span> Elo</span>
        <span id="elo-cat"></span>
      </div>
      <input type="range" id="ai-level" min="200" max="3000" step="50" value="1500"
             oninput="afficherNiveau(this.value)" onchange="changerNiveauIA()">
      <div class="bornes"><span>200</span><span>3000</span></div>
    </div>
    <div id="controls">
      <button id="best-btn" onclick="toggleBestMove()" title="Meilleur coup selon Stockfish (B)">Montrer meilleur coup</button>
    </div>
    <p id="best-info"></p>
    <div id="promo"></div>
    <p id="msg"></p>
  </div>
  <div id="moves"></div>
</div>

<script>
const GLYPHS = { K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',
                 k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟' };
const STATUTS = { ok: '', echec: 'Check!', pat: 'Stalemate' };
const FIGURINES = true; // true: ♘f3 (comme chess.com), false: Nf3
let selected = null;
let legal = [];
let etat = null;
let best = null;        // dernière analyse reçue : { coup, fen, uci, san, eval, profondeur }
let bestLoading = false;

function parseFen(fen) {
  const rows = fen.split(' ')[0].split('/');
  return rows.map(r => {
    const out = [];
    for (const ch of r) {
      if (/\d/.test(ch)) out.push(...Array(+ch).fill(''));
      else out.push(ch);
    }
    return out;
  });
}

function name(r, c) { return 'abcdefgh'[c] + (8 - r); }

function pieceAt(n) {
  const grid = parseFen(etat.fen);
  return grid[8 - +n[1]]['abcdefgh'.indexOf(n[0])];
}

function fig(san, white) {
  if (!FIGURINES || !'KQRBN'.includes(san[0])) return san;
  return GLYPHS[white ? san[0] : san[0].toLowerCase()] + san.slice(1);
}

function renderMoves(state) {
  const box = document.getElementById('moves');
  box.innerHTML = '';
  const list = state.notation;
  let current = null;
  for (let i = 0; i < list.length; i += 2) {
    const row = document.createElement('div');
    row.className = 'row';
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = (i / 2 + 1) + '.';
    row.appendChild(num);
    for (let j = i; j < i + 2; j++) {
      const cell = document.createElement('div');
      cell.className = 'mv';
      if (j < list.length) {
        cell.textContent = fig(list[j], j % 2 === 0);
        // state.coup = nombre de coups affichés : le dernier coup affiché est l'indice coup-1
        if (j === state.coup - 1) { cell.classList.add('current'); current = cell; }
      }
      row.appendChild(cell);
    }
    box.appendChild(row);
  }
  if (current) current.scrollIntoView({ block: 'nearest' });
  else box.scrollTop = 0;
}

function render(state) {
  etat = state;
  // l'analyse ne vaut que pour la position où elle a été demandée
  if (best && (best.coup !== state.coup || best.fen !== state.fen)) best = null;
  const grid = parseFen(state.fen);
  const board = document.getElementById('board');
  board.innerHTML = '';
  grid.forEach((row, r) => row.forEach((p, c) => {
    const sq = document.createElement('div');
    const n = name(r, c);
    const hint = legal.includes(n) ? (p ? ' hint-capture' : ' hint') : '';
    const bestSq = best && best.uci && (best.uci.slice(0, 2) === n || best.uci.slice(2, 4) === n);
    sq.className = 'sq ' + ((r + c) % 2 ? 'dark' : 'light') +
                   (selected === n ? ' selected' : '') + hint + (bestSq ? ' best-sq' : '');
    sq.textContent = p ? GLYPHS[p] : '';
    sq.onclick = () => clickSquare(n);
    board.appendChild(sq);
  }));

  renderMoves(state);
  renderBest(state);
  if (state.elo && !niveauInitialise) {     // au chargement : reprendre le niveau du serveur
    document.getElementById('ai-level').value = state.elo;
    afficherNiveau(state.elo);
    niveauInitialise = true;
  }
  document.getElementById('counter').textContent = 'Move ' + state.coup + ' / ' + state.total;
  let msg = state.statut === 'mat'
    ? 'Checkmate, ' + (state.trait === 'Blanc' ? 'Black' : 'White') + ' wins'
    : STATUTS[state.statut];
  if (!state.live) msg = 'Viewing an earlier position (go to the last move to play). ' + msg;
  document.getElementById('msg').textContent = msg;
}

function choosePromotion(white) {
  return new Promise(resolve => {
    const box = document.getElementById('promo');
    box.innerHTML = '';
    for (const t of ['Q', 'R', 'B', 'N']) {
      const b = document.createElement('button');
      b.textContent = GLYPHS[white ? t : t.toLowerCase()];
      b.onclick = () => { box.innerHTML = ''; resolve(t); };
      box.appendChild(b);
    }
  });
}

// ---------- Meilleur coup (Stockfish) ----------

async function toggleBestMove() {
  if (bestLoading) return;
  if (best) { best = null; return render(etat); }   // 2e clic : masquer

  const coupDemande = etat.coup, fenDemandee = etat.fen;
  bestLoading = true;
  renderBest(etat);
  let data = null;
  try {
    data = await (await fetch('/api/best-move', { method: 'POST' })).json();
  } catch (e) {
    data = { coup: coupDemande, fen: fenDemandee, erreur: 'Serveur injoignable' };
  }
  bestLoading = false;
  // si on a changé de position pendant l'analyse, on ignore le résultat
  if (etat.coup === coupDemande && etat.fen === fenDemandee) best = data;
  render(etat);
}

function renderBest(state) {
  const btn = document.getElementById('best-btn');
  const info = document.getElementById('best-info');
  btn.disabled = bestLoading;
  btn.textContent = best ? 'Masquer meilleur coup' : 'Montrer meilleur coup';

  if (bestLoading) info.textContent = 'Stockfish analyse la position…';
  else if (!best) info.textContent = '';
  else if (best.fin) info.textContent = 'Partie terminée : aucun coup à jouer.';
  else if (best.erreur) info.textContent = 'Erreur : ' + best.erreur;
  else {
    const white = state.trait === 'Blanc';
    const cls = best.eval.startsWith('-') ? 'noir' : 'blanc';
    info.innerHTML = 'Meilleur coup : <b></b><span class="eval ' + cls + '"></span>' +
                     ' <small style="color:#888">profondeur ' + best.profondeur + '</small>';
    info.querySelector('b').textContent = fig(best.san, white);
    info.querySelector('.eval').textContent = best.eval;
  }
  drawArrow(best && best.uci ? best.uci : null);
}

// Dessine une flèche from -> to sur l'échiquier (en L pour un cavalier, comme chess.com)
function drawArrow(uci) {
  const svg = document.getElementById('arrows');
  if (!uci) { svg.innerHTML = ''; return; }
  const S = 64;
  const centre = sq => ['abcdefgh'.indexOf(sq[0]) * S + S / 2, (8 - +sq[1]) * S + S / 2];
  const [x1, y1] = centre(uci.slice(0, 2));
  const [x2, y2] = centre(uci.slice(2, 4));
  const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);

  let pts = [[x1, y1]];
  if ((dx === S && dy === 2 * S) || (dx === 2 * S && dy === S)) {
    pts.push(dy > dx ? [x1, y2] : [x2, y1]);     // coude du L
  }
  pts.push([x2, y2]);

  // la ligne s'arrête à la base de la pointe
  const [px, py] = pts[pts.length - 2];
  const len = Math.hypot(x2 - px, y2 - py);
  const ux = (x2 - px) / len, uy = (y2 - py) / len;
  const head = 26, half = 18, tipBack = 8;          // tailles en px
  const tx = x2 - ux * tipBack, ty = y2 - uy * tipBack; // pointe légèrement avant le centre
  const bx = tx - ux * head, by = ty - uy * head;
  pts[pts.length - 1] = [bx, by];

  const color = 'rgba(255, 170, 0, 0.85)';
  const line = pts.map(p => p.join(',')).join(' ');
  const tri = [[tx, ty], [bx - uy * half, by + ux * half], [bx + uy * half, by - ux * half]]
              .map(p => p.join(',')).join(' ');
  svg.innerHTML =
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="14" stroke-linejoin="round"/>' +
    '<polygon points="' + tri + '" fill="' + color + '"/>';
}

async function fetchLegal(n) {
  return await (await fetch('/api/legal?from=' + n)).json();
}

async function clickSquare(n) {
  if (!etat.live) return;
  const p = pieceAt(n);
  const own = !!p && (p === p.toUpperCase()) === (etat.trait === 'Blanc');

  if (!selected) {                    // first click: only your own pieces
    if (!own) return;
    selected = n;
    legal = await fetchLegal(n);
    return load();
  }
  if (selected === n) {                  // click again to deselect
    selected = null; legal = [];
    return load();
  }
  if (own) {                             // click another own piece: switch selection
    selected = n;
    legal = await fetchLegal(n);
    return load();
  }

  const body = { from: selected, to: n };
  const sel = pieceAt(selected);
  if ((sel === 'P' && n[1] === '8') || (sel === 'p' && n[1] === '1')) {
    body.promotion = await choosePromotion(sel === 'P');
  }

  const res = await fetch('/api/move', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const ok = res.ok;
  const newState = await res.json();
  
  selected = null; legal = [];
  render(newState);
  
  if (!ok) {
    document.getElementById('msg').textContent = 'Illegal move';
    return;
  }

  // --- INTÉGRATION STOCKFISH ---
  // L'IA joue si la partie est en cours ("ok" ou "echec") et que c'est aux Noirs
  if ((newState.statut === 'ok' || newState.statut === 'echec') && newState.trait === 'Noir') {
    document.getElementById('msg').textContent = "Stockfish réfléchit...";
    
    // Petit délai de sécurité pour laisser l'UI souffler, puis appel de l'IA
    setTimeout(async () => {
      const aiRes = await fetch('/api/ai-move');
      if (aiRes.ok) {
        const aiState = await aiRes.json();
        render(aiState);
      }
    }, 200);
  }
}

async function act(url) {
  selected = null; legal = [];
  document.getElementById('promo').innerHTML = '';
  render(await (await fetch(url, { method: 'POST' })).json());
}

async function load() {
  render(await (await fetch('/api/state')).json());
}

// --- NIVEAU DE L'IA (curseur de 200 à 3000 Elo) ---
let niveauInitialise = false;

function categorieNiveau(elo) {
  if (elo < 600)  return 'Grand débutant';
  if (elo < 1000) return 'Débutant';
  if (elo < 1400) return 'Occasionnel';
  if (elo < 1800) return 'Intermédiaire';
  if (elo < 2200) return 'Avancé';
  if (elo < 2600) return 'Maître';
  return 'Grand maître';
}

function afficherNiveau(elo) {
  document.getElementById('elo-val').textContent = elo;
  document.getElementById('elo-cat').textContent = categorieNiveau(+elo);
}

async function changerNiveauIA() {
  const elo = document.getElementById('ai-level').value;
  await fetch('/api/level', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ elo: parseInt(elo) })
  });
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; // ex: flèches sur le curseur
  if (e.key === 'ArrowLeft') act('/api/undo');
  if (e.key === 'ArrowRight') act('/api/redo');
  if (e.key === 'b' || e.key === 'B') toggleBestMove();
});

load();
</script>
</body>
</html>
